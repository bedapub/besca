name: Build Sphinx Documentation
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docs:
    name: Build docs
    runs-on: ubuntu-latest
    # the build currently stalls on notebook2_celltype_annotation_pbmc3k.ipynb
    timeout-minutes: 60
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system dependencies
        # pandoc is required by nbsphinx, graphviz by pydot
        run: sudo apt-get update && sudo apt-get install -y graphviz pandoc
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --group docs
      - name: Run Sphinx
        run: |
          cd docs
          # gallery examples and tutorial notebooks need large datasets; render them without executing
          uv run make html SPHINXOPTS="-D plot_gallery=0 -D nbsphinx_execute=never"
      - name: Store the built documentation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: besca-docs-html
          path: docs/build/html/

  deploy-docs:
    name: Deploy docs to gh-pages
    # only documentation built from main is published
    if: github.ref == 'refs/heads/main'
    needs:
      - build-docs
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push to the gh-pages branch
    steps:
      - name: Download the built documentation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: besca-docs-html
          path: html/
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./html
          publish_branch: gh-pages
          force_orphan: true
