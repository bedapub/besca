name: Build Sphinx Documentation
on:
  workflow_dispatch:

jobs:
  build-docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Install system dependencies
        # pandoc is required by nbsphinx, graphviz by pydot
        run: sudo apt-get update && sudo apt-get install -y graphviz pandoc
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --group docs
      - name: Run Sphinx
        run: |
          cd docs
          uv run make html
