name: Dependency security audit

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10
      - name: Export locked dependencies
        run: uv export --locked --all-groups --no-emit-project --no-hashes --format requirements-txt -o requirements-audit.txt
      - name: Audit locked dependencies
        run: uvx pip-audit --no-deps --disable-pip -r requirements-audit.txt
