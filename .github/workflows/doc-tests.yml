name: Run doctests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  doc-test-job:
    name: Doctests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system dependencies
        # graphviz provides the layout binaries used by pydot (bc.pl.nomenclature_network)
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Restore test datasets
        id: datasets
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: besca/datasets/data/*.h5ad
          # bump v1 when the datasets downloaded below change
          key: besca-datasets-v1-${{ hashFiles('besca/datasets/_datasets.py') }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Download test datasets
        # the tests use these datasets from zenodo; all other test data is simulated
        if: steps.datasets.outputs.cache-hit != 'true'
        run: >-
          uv run python -c "import besca as bc;
          bc.datasets.Kotliarov2020_processed();
          bc.datasets.crispr_10x_filtered()"
      - name: Save test datasets
        # saved before the tests run, so failing tests do not prevent caching
        if: steps.datasets.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: besca/datasets/data/*.h5ad
          key: ${{ steps.datasets.outputs.cache-primary-key }}
      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          cd besca
          uv run pytest --doctest-modules -W ignore::PendingDeprecationWarning --durations=0
          cd ..
          uv run pytest
