name: Run doctests

on: [push, pull_request]

jobs:
  doc-test-job:
    name: Doctests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Install system dependencies
        # graphviz provides the layout binaries used by pydot (bc.pl.nomenclature_network)
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        shell: bash
        run: |
          cd besca
          export PYTHONDONTWRITEBYTECODE=1
          uv run pytest --doctest-modules -W ignore::PendingDeprecationWarning --durations=0
          cd ..
          uv run pytest
